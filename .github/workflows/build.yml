name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # The two macOS options are ignored on Windows.
      # Universal binary (Intel + Apple Silicon) so it also runs on older Intel Macs.
      - name: Configure
        shell: bash
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCOPY_AFTER_BUILD=OFF
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PitchBend-${{ matrix.os }}
          path: build/PitchBend_artefacts/Release/VST3/
